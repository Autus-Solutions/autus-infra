name: Reusable K8s Registry Secret Sync

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      secret_name:
        required: false
        type: string
        default: ghcr-pull-secret
      environment_name:
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        required: true
      AUTUS_GHCR_PUSH_USERNAME:
        required: true
      AUTUS_GHCR_PUSH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sync:
    name: Sync registry pull secret
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is empty or unavailable." >&2
            exit 1
          fi

          # KUBE_CONFIG aceito como YAML cru (microk8s config) ou base64.
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG" | base64 -di > "$HOME/.kube/config" 2>/dev/null || \
              printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl config view --minify >/dev/null

      - name: Create or update pull secret
        shell: bash
        env:
          NAMESPACE: ${{ inputs.namespace }}
          SECRET_NAME: ${{ inputs.secret_name }}
          GHCR_USERNAME: ${{ secrets.AUTUS_GHCR_PUSH_USERNAME }}
          GHCR_TOKEN: ${{ secrets.AUTUS_GHCR_PUSH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GHCR_USERNAME" ] || [ -z "$GHCR_TOKEN" ]; then
            echo "GHCR pull credentials are empty or unavailable." >&2
            exit 1
          fi

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry "$SECRET_NAME" \
            --namespace "$NAMESPACE" \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --docker-email=noreply@autus.solutions \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Kubernetes docker-registry secret $NAMESPACE/$SECRET_NAME is synced."
