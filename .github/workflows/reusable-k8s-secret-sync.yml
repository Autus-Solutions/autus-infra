name: Reusable Kubernetes Secret Sync

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      secret_name:
        required: true
        type: string
      keys:
        required: false
        type: string
        default: ""
      environment_name:
        required: true
        type: string
    secrets:
      KUBE_CONFIG:
        required: true
      KUBE_CONTEXT:
        required: false
      ASPNETCORE_ENVIRONMENT:
        required: false
      CONNECTIONSTRINGS__DATABASE:
        required: false
      CONNECTIONSTRINGS__TIMESERIES:
        required: false
      CONNECTIONSTRINGS__AMQP:
        required: false
      MESSAGEBROKER__HOST:
        required: false
      MESSAGEBROKER__VHOST:
        required: false
      MESSAGEBROKER__PORT:
        required: false
      MESSAGEBROKER__USERNAME:
        required: false
      MESSAGEBROKER__PASSWORD:
        required: false
      MQTTBROKER__HOST:
        required: false
      MQTTBROKER__PORT:
        required: false
      MQTTBROKER__USERNAME:
        required: false
      MQTTBROKER__PASSWORD:
        required: false
      SENDGRID_API_KEY:
        required: false
      CFTURNSTILE_SECRET_KEY:
        required: false
      SECRETS_JSON:
        required: false

permissions:
  contents: read

jobs:
  sync:
    name: Sync Kubernetes Secret
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
          KUBE_CONTEXT: ${{ secrets.KUBE_CONTEXT }}
        run: |
          mkdir -p "$HOME/.kube"
          if [ -z "$KUBE_CONFIG" ]; then
            echo "KUBE_CONFIG secret is empty or unavailable." >&2
            exit 1
          fi

          # Diagnostic (formato apenas, sem expor o conteudo do secret).
          echo "DIAG length=${#KUBE_CONFIG}"
          printf 'DIAG first=%s\n' "$(printf '%s' "$KUBE_CONFIG" | cut -c1)"
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then echo 'DIAG apiVersion=yes'; else echo 'DIAG apiVersion=no'; fi
          if printf '%s' "$KUBE_CONFIG" | base64 -d >/dev/null 2>&1; then echo 'DIAG base64_strict=yes'; else echo 'DIAG base64_strict=no'; fi

          # KUBE_CONFIG aceito como YAML cru (microk8s config) ou base64.
          if printf '%s' "$KUBE_CONFIG" | grep -q 'apiVersion:'; then
            printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBE_CONFIG" | base64 -di > "$HOME/.kube/config" 2>/dev/null || \
              printf '%s' "$KUBE_CONFIG" > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          kubectl config view --minify >/dev/null
          if [ -n "$KUBE_CONTEXT" ]; then
            kubectl config use-context "$KUBE_CONTEXT"
          fi

      - name: Create or update secret
        shell: bash
        env:
          NAMESPACE: ${{ inputs.namespace }}
          SECRET_NAME: ${{ inputs.secret_name }}
          SECRET_KEYS: ${{ inputs.keys }}
          ASPNETCORE_ENVIRONMENT: ${{ secrets.ASPNETCORE_ENVIRONMENT }}
          ConnectionStrings__Database: ${{ secrets.CONNECTIONSTRINGS__DATABASE }}
          ConnectionStrings__Timeseries: ${{ secrets.CONNECTIONSTRINGS__TIMESERIES }}
          ConnectionStrings__Amqp: ${{ secrets.CONNECTIONSTRINGS__AMQP }}
          MessageBroker__Host: ${{ secrets.MESSAGEBROKER__HOST }}
          MessageBroker__VHost: ${{ secrets.MESSAGEBROKER__VHOST }}
          MessageBroker__Port: ${{ secrets.MESSAGEBROKER__PORT }}
          MessageBroker__Username: ${{ secrets.MESSAGEBROKER__USERNAME }}
          MessageBroker__Password: ${{ secrets.MESSAGEBROKER__PASSWORD }}
          MqttBroker__Host: ${{ secrets.MQTTBROKER__HOST }}
          MqttBroker__Port: ${{ secrets.MQTTBROKER__PORT }}
          MqttBroker__Username: ${{ secrets.MQTTBROKER__USERNAME }}
          MqttBroker__Password: ${{ secrets.MQTTBROKER__PASSWORD }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          CFTURNSTILE_SECRET_KEY: ${{ secrets.CFTURNSTILE_SECRET_KEY }}
          SECRETS_JSON: ${{ secrets.SECRETS_JSON }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${SECRETS_JSON:-}" ]; then
            # Generic path: SECRETS_JSON is a JSON object keyed by Kubernetes Secret
            # name, e.g. {"ebc-api-secrets": {"Key": "value", ...}, ...}. The entry
            # matching `secret_name` is synced. Values with newlines must be minified.
            while IFS= read -r kv; do
              [ -z "$kv" ] && continue
              args+=(--from-literal="$kv")
            done < <(printf '%s' "$SECRETS_JSON" | jq -r --arg n "$SECRET_NAME" '.[$n] // {} | to_entries[] | "\(.key)=\(.value)"')
          else
            # Legacy path: named secrets referenced by the `keys` list.
            while IFS= read -r key; do
              key="$(printf '%s' "$key" | xargs)"
              [ -z "$key" ] && continue
              value="${!key:-}"
              if [ -z "$value" ]; then
                echo "Required secret is empty or unavailable: $key" >&2
                exit 1
              fi
              args+=(--from-literal="$key=$value")
            done <<< "$SECRET_KEYS"
          fi

          if [ "${#args[@]}" -eq 0 ]; then
            echo "No secret keys provided. Pass SECRETS_JSON or a non-empty keys list." >&2
            exit 1
          fi

          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic "$SECRET_NAME" \
            -n "$NAMESPACE" \
            "${args[@]}" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Kubernetes Secret $NAMESPACE/$SECRET_NAME is synced."
